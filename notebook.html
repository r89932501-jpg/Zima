<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a1b"><title>Блокнот смен — ПРОФИЛЬ</title>
<style>
:root{color-scheme:dark;--bg:#101a1b;--panel:#192627;--line:#304344;--muted:#9aacab;--accent:#f2c14e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef5f2;font:15px system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 14px calc(90px + env(safe-area-inset-bottom));max-width:760px;margin:auto}header{padding:20px 4px 14px}h1{font-size:25px;margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;color:var(--muted);margin:8px 0 5px}input,select,button{font:inherit}input,select{width:100%;background:#101a1b;color:#eef5f2;border:1px solid var(--line);border-radius:10px;padding:12px;min-height:44px}button{border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#172020;font-weight:700}.secondary{background:#2a3b3c;color:#eef5f2}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row button{flex:1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#101a1b;border-radius:12px;padding:12px}.stat b{display:block;font-size:20px;color:var(--accent)}.stat span{font-size:11px;color:var(--muted)}.entry{border-top:1px solid var(--line);padding:12px 0}.entry:first-child{border:0}.entry b{display:block}.entry small{color:var(--muted)}.danger{background:#512f32;color:#ffe1e1}.hidden{display:none!important}@media(max-width:420px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><h1>Блокнот смен</h1><div class="muted">Все даты и время — московское (МСК, UTC+3)</div></header>
<section class="card"><h2 style="font-size:17px;margin:0 0 8px">Новая запись</h2>
<label>Тип события</label><select id="kind"><option value="work">Работа</option><option value="passenger">Следование пассажиром</option><option value="meal">Обед</option></select>
<div class="grid"><div><label>Начало — дата</label><input id="startDate" type="date"></div><div><label>Начало — время МСК</label><input id="startTime" type="time"></div><div><label>Окончание — дата</label><input id="endDate" type="date"></div><div><label>Окончание — время МСК</label><input id="endTime" type="time"></div></div>
<label>Примечание (необязательно)</label><input id="note" type="text" placeholder="Например, маршрут или номер смены">
<div class="row" style="margin-top:14px"><button id="save">Сохранить запись</button><button class="secondary hidden" id="cancel">Отмена</button></div><div class="muted" id="message" style="margin-top:8px"></div></section>
<section class="card"><div class="row" style="justify-content:space-between"><h2 style="font-size:17px;margin:0">Итоги за месяц</h2><input id="month" type="month" style="width:auto"></div><div class="stats" style="margin-top:12px"><div class="stat"><b id="workTotal">0:00</b><span>Работа</span></div><div class="stat"><b id="passTotal">0:00</b><span>Пассажиром</span></div><div class="stat"><b id="mealTotal">0:00</b><span>Обед</span></div><div class="stat"><b id="nightTotal">0:00</b><span>Ночные (00:00–05:00)</span></div></div><p class="muted">Смены, переходящие через полночь или границу месяца, распределяются по фактическим календарным датам.</p></section>
<section class="card"><div class="row" style="justify-content:space-between"><h2 style="font-size:17px;margin:0">История</h2><button class="secondary" id="export">Экспорт JSON</button></div><div id="history" class="muted" style="margin-top:10px">Записей пока нет</div></section>
<script>
(function(){
const KEY='profile_shift_notebook_v2';let items=JSON.parse(localStorage.getItem(KEY)||'[]'),editing=null;
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0');
function mskNow(){let p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());let o={};p.forEach(x=>o[x.type]=x.value);let t=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date());return [o.year+'-'+o.month+'-'+o.day,t]}
function stamp(d,t){return Date.parse(d+'T'+t+':00+03:00')}
function dur(ms){let m=Math.round(ms/60000);return Math.floor(m/60)+':'+pad(m%60)}
function save(){localStorage.setItem(KEY,JSON.stringify(items))}
function mskDayStart(ms){let d=new Date(ms+3*3600000);return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-3*3600000}function splitMinutes(a,b,month){let total=0,cur=a;while(cur<b){let dayStart=mskDayStart(cur),stop=Math.min(b,dayStart+86400000),d=new Date(dayStart+3*3600000),key=d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1);if(key===month)total+=stop-cur;cur=stop}return total}function splitNightMinutes(a,b,month){let total=0,cur=a;while(cur<b){let dayStart=mskDayStart(cur),dayEnd=dayStart+86400000,nightStart=dayStart,nightEnd=dayStart+5*3600000,d=new Date(dayStart+3*3600000),key=d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1);if(key===month){let left=Math.max(a,nightStart),right=Math.min(b,nightEnd);if(right>left)total+=right-left}cur=Math.min(b,dayEnd)}return total}
function render(){let m=$('month').value;let sums={work:0,passenger:0,meal:0},night=0;items.forEach(x=>{let a=stamp(x.sd,x.st),b=stamp(x.ed,x.et);if(Number.isFinite(a)&&Number.isFinite(b)&&b>a){sums[x.kind]+=splitMinutes(a,b,m);if(x.kind==='work')night+=splitNightMinutes(a,b,m)}});$('workTotal').textContent=dur(sums.work);$('passTotal').textContent=dur(sums.passenger);$('mealTotal').textContent=dur(sums.meal);$('nightTotal').textContent=dur(night);
let sorted=[...items].sort((a,b)=>stamp(b.sd,b.st)-stamp(a.sd,a.st));$('history').innerHTML=sorted.length?'':'Записей пока нет';sorted.forEach(x=>{let i=items.indexOf(x),d=document.createElement('div');d.className='entry';let title={work:'Работа',passenger:'Следование пассажиром',meal:'Обед'}[x.kind];d.innerHTML='<b>'+title+'</b><small>'+x.sd+' '+x.st+' → '+x.ed+' '+x.et+' МСК · '+dur(stamp(x.ed,x.et)-stamp(x.sd,x.st))+(x.note?' · '+escapeHtml(x.note):'')+'</small><div class="row" style="margin-top:8px"><button class="secondary" data-edit="'+i+'">Изменить</button><button class="danger" data-del="'+i+'">Удалить</button></div>'; $('history').appendChild(d)})}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function reset(){editing=null;$('kind').value='work';$('note').value='';let [d,t]=mskNow();$('startDate').value=d;$('startTime').value=t;$('endDate').value=d;$('endTime').value=t;$('save').textContent='Сохранить запись';$('cancel').classList.add('hidden')}
$('save').onclick=()=>{let x={kind:$('kind').value,sd:$('startDate').value,st:$('startTime').value,ed:$('endDate').value,et:$('endTime').value,note:$('note').value.trim()};let a=stamp(x.sd,x.st),b=stamp(x.ed,x.et);if(!x.sd||!x.st||!x.ed||!x.et||!Number.isFinite(a)||!Number.isFinite(b)||b<=a){$('message').textContent='Проверь даты и время: окончание должно быть позже начала.';return}if(editing===null)items.push(x);else items[editing]=x;save();reset();$('message').textContent='Запись сохранена';render()};
$('cancel').onclick=reset;$('history').onclick=e=>{let ed=e.target.dataset.edit,del=e.target.dataset.del;if(ed!==undefined){editing=+ed;let x=items[editing];$('kind').value=x.kind;$('startDate').value=x.sd;$('startTime').value=x.st;$('endDate').value=x.ed;$('endTime').value=x.et;$('note').value=x.note;$('save').textContent='Сохранить изменения';$('cancel').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}if(del!==undefined&&confirm('Удалить эту запись?')){items.splice(+del,1);save();render()}};$('month').onchange=render;$('export').onclick=()=>{let blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bloknot-smen.json';a.click();URL.revokeObjectURL(a.href)};
let [d]=mskNow();$('month').value=d.slice(0,7);reset();render();
})();
</script></body></html>
